PACKAGE_NAME="nxs-csi2"
PACKAGE_VERSION="1.3.0"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/media/i2c CONFIG_VIDEO_NXS_CSI2=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build/drivers/media/i2c clean"
BUILT_MODULE_NAME[0]="nxs-csi2-core"
BUILT_MODULE_LOCATION[0]="drivers/media/i2c"
DEST_MODULE_LOCATION[0]="/extra"
BUILT_MODULE_NAME[1]="nxs-csi2"
BUILT_MODULE_LOCATION[1]="drivers/media/i2c"
DEST_MODULE_LOCATION[1]="/extra"
BUILT_MODULE_NAME[2]="nxs-hub-route"
BUILT_MODULE_LOCATION[2]="drivers/media/i2c"
DEST_MODULE_LOCATION[2]="/extra"
AUTOINSTALL="yes"
